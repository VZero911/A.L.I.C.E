## V0 PUBLIC NODE — AUTO DEPLOYMENT
## Zero cloud deps — Ollama for local LLM
## Docker auto-starts everything, self-managing
## Interact: MCP client → HTTP → alice-general

services:
  # ═══════════ OLLAMA — LOCAL LLM ═══════════
  ollama:
    image: ollama/ollama:0.3.12
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - v0net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 3s
      retries: 5

  # ═══════════ THESEED — L0 BLOCKCHAIN (geth Clique PoA, chainId 0) ═══════════
  theseed-l0:
    image: ethereum/client-go:v1.14.12
    container_name: theseed-l0
    restart: unless-stopped
    command: ["--networkid", "0", "--http", "--http.addr", "0.0.0.0", "--http.port", "8546", "--http.api", "eth,net,web3,clique", "--http.corsdomain", "*", "--rpc.allow-unprotected-txs", "--nodiscover"]
    ports:
      - "127.0.0.1:8546:8546"
    networks:
      - v0net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8546"]
      interval: 15s
      timeout: 3s
      retries: 5

  theseed-postgres:
    image: postgres:16-alpine
    container_name: theseed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: theseed
      POSTGRES_USER: theseed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-theseed_v0_local}
    volumes:
      - theseed-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - v0net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theseed"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ═══════════ ALICE-NODE — AUTONOMOUS AGENT ═══════════
  alice-node:
    build:
      context: ./alice-node
      dockerfile: Dockerfile
    container_name: alice-node
    restart: unless-stopped
    network_mode: host
    environment:
      - ALICE_ROLE=GENERAL
      - ALICE_PORT=7781
      - ALICE_PERMS=PUBLIC
      - RPC_URL=http://127.0.0.1:8546
      - CHAIN_ID=0
      - OLLAMA_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=mistral
    volumes:
      - alice-data:/data
    depends_on:
      theseed-l0:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7781/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  v0net:
    driver: bridge

volumes:
  theseed-pgdata:
  alice-data:
  ollama-data:
